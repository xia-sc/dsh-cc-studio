<!doctype html>
<html><head><meta charset="utf-8"><style>
  body{margin:0;font-family:"Segoe UI","Microsoft YaHei",sans-serif}
  .light{background:#f3f1fb;padding:40px 44px}
  .dark{background:#1a1430;padding:40px 44px}
  .row{display:flex;align-items:center;gap:28px;flex-wrap:wrap}
  img{border-radius:22%}
  .t{font-size:13px;color:#7a7290;width:100%;margin:0 0 6px}
  .dark .t{color:#a89ed6}
</style></head>
<body>
  <div class="light">
    <div class="t">浅色界面：透明底 mark 与带底图标</div>
    <div class="row">
      <img src="../png/mark-256.png" width="128" height="128">
      <img src="../png/mark-128.png" width="64" height="64">
      <img src="../png/mark-64.png" width="32" height="32">
      <img src="../png/mark-32.png" width="32" height="32">
      <img src="../png/mark-16.png" width="16" height="16">
      <img src="../png/logo-128.png" width="64" height="64">
      <img src="../png/logo-64.png" width="32" height="32">
      <img src="../png/logo-32.png" width="32" height="32">
      <img src="../png/logo-16.png" width="16" height="16">
    </div>
  </div>
  <div class="dark">
    <div class="t">深色界面：同一份资产</div>
    <div class="row">
      <img src="../png/mark-256.png" width="128" height="128">
      <img src="../png/mark-128.png" width="64" height="64">
      <img src="../png/mark-64.png" width="32" height="32">
      <img src="../png/mark-16.png" width="16" height="16">
      <img src="../png/logo-128.png" width="64" height="64">
      <img src="../png/logo-64.png" width="32" height="32">
      <img src="../png/logo-16.png" width="16" height="16">
    </div>
  </div>
</body></html>
