<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; background: #f3f1fb; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; color: #2b2440; }
  .wrap { display: flex; gap: 44px; padding: 48px 52px; align-items: flex-start; flex-wrap: wrap; }
  figure { margin: 0; width: 300px; }
  .hero { width: 300px; height: 300px; border-radius: 68px; overflow: hidden; box-shadow: 0 18px 40px rgba(70,48,160,.18); }
  .hero img { display: block; width: 100%; height: 100%; }
  figcaption { margin-top: 14px; font-size: 20px; font-weight: 600; }
  .sub { margin-top: 4px; font-size: 14px; color: #6b6386; line-height: 1.5; }
  .sizes { display: flex; gap: 16px; margin-top: 14px; align-items: flex-end; }
  .sizes img { border-radius: 22%; box-shadow: 0 4px 10px rgba(70,48,160,.12); }
  .sizes .s64 { width: 64px; height: 64px; }
  .sizes .s32 { width: 32px; height: 32px; }
  .sizes .s16 { width: 16px; height: 16px; }
  .dark { background: #1a1430; padding: 48px 52px; display: flex; gap: 36px; align-items: center; }
  .dark img { width: 96px; height: 96px; border-radius: 22%; }
</style>
</head>
<body>
  <div class="wrap">
    <figure>
      <div class="hero"><img src="../logo-a-card-mask.svg" alt="方案 A 卡牌面具"></div>
      <figcaption>A · 卡牌面具</figcaption>
      <div class="sub">角色卡 + 戏剧面具 + 创作火花；两张卡暗示卡组。</div>
      <div class="sizes">
        <img class="s64" src="../logo-a-card-mask.svg" alt="64">
        <img class="s32" src="../logo-a-card-mask.svg" alt="32">
        <img class="s16" src="../logo-a-card-mask.svg" alt="16">
      </div>
    </figure>
    <figure>
      <div class="hero"><img src="../logo-b-capsule.svg" alt="方案 B 胶囊展开"></div>
      <figcaption>B · 胶囊展开</figcaption>
      <div class="sub">输入框胶囊里展开一张角色卡，直指「点开胶囊就是工坊」。</div>
      <div class="sizes">
        <img class="s64" src="../logo-b-capsule.svg" alt="64">
        <img class="s32" src="../logo-b-capsule.svg" alt="32">
        <img class="s16" src="../logo-b-capsule.svg" alt="16">
      </div>
    </figure>
    <figure>
      <div class="hero"><img src="../logo-c-badge.svg" alt="方案 C 工坊徽章"></div>
      <figcaption>C · 工坊徽章</figcaption>
      <div class="sub">六边形匠人徽章 + 卡牌，深色底更沉稳，适合插件市场货架。</div>
      <div class="sizes">
        <img class="s64" src="../logo-c-badge.svg" alt="64">
        <img class="s32" src="../logo-c-badge.svg" alt="32">
        <img class="s16" src="../logo-c-badge.svg" alt="16">
      </div>
    </figure>
  </div>
  <div class="dark">
    <img src="../logo-a-card-mask.svg" alt="A dark">
    <img src="../logo-b-capsule.svg" alt="B dark">
    <img src="../logo-c-badge.svg" alt="C dark">
    <span style="color:#cdc4ff;font-size:15px">深色界面下的表现</span>
  </div>
</body>
</html>
