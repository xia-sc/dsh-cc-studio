<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="CC 角色卡工坊">
  <defs>
    <linearGradient id="headM" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a6bff"/>
      <stop offset="1" stop-color="#6444f0"/>
    </linearGradient>
    <linearGradient id="starM" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe0a3"/>
      <stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
    <filter id="shadowM" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#2a1a6e" flood-opacity=".3"/>
    </filter>
  </defs>

  <!-- 后一张卡 -->
  <g transform="rotate(8 256 256)">
    <rect x="212" y="138" width="208" height="286" rx="30" fill="#7c5cff" fill-opacity=".16"
          stroke="#7c5cff" stroke-opacity=".4" stroke-width="3"/>
  </g>

  <!-- 角色卡主体（透明底版：白卡配紫色细描边，深浅背景都成立） -->
  <g transform="rotate(-7 256 256)">
    <rect x="124" y="98" width="216" height="300" rx="30" fill="#ffffff"
          stroke="#7c5cff" stroke-opacity=".45" stroke-width="3" filter="url(#shadowM)"/>

    <rect x="146" y="120" width="172" height="58" rx="18" fill="url(#headM)"/>
    <circle cx="180" cy="149" r="16" fill="#ffffff" fill-opacity=".92"/>
    <rect x="206" y="136" width="78" height="10" rx="5" fill="#ffffff" fill-opacity=".88"/>
    <rect x="206" y="154" width="52" height="8" rx="4" fill="#ffffff" fill-opacity=".55"/>

    <path d="M181 226 C 181 208 198 197 219 200 L 240 204 L 261 200 C 282 197 299 208 299 226
             C 299 258 281 290 240 306 C 199 290 181 258 181 226 Z"
          fill="none" stroke="#3b2a86" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="212" cy="238" rx="15" ry="10" fill="#3b2a86" transform="rotate(-10 212 238)"/>
    <ellipse cx="268" cy="238" rx="15" ry="10" fill="#3b2a86" transform="rotate(10 268 238)"/>
    <path d="M232 267 C 236 276 244 276 248 267" fill="none" stroke="#3b2a86" stroke-width="9" stroke-linecap="round"/>

    <rect x="150" y="336" width="164" height="11" rx="5.5" fill="#d9d2f5"/>
    <rect x="150" y="358" width="112" height="11" rx="5.5" fill="#e9e4fb"/>
  </g>

  <!-- 创作火花 -->
  <g transform="translate(394 132)">
    <path d="M0 -34 C 3 -10 10 -3 34 0 C 10 3 3 10 0 34 C -3 10 -10 3 -34 0 C -10 -3 -3 -10 0 -34 Z"
          fill="url(#starM)"/>
  </g>
</svg>
