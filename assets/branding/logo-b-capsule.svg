<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="CC 角色卡工坊">
  <defs>
    <linearGradient id="bgB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b3df5"/>
      <stop offset=".6" stop-color="#8a6bff"/>
      <stop offset="1" stop-color="#c4b5ff"/>
    </linearGradient>
    <linearGradient id="headB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#6444f0"/>
    </linearGradient>
    <linearGradient id="starB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe0a3"/>
      <stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
    <filter id="shadowB" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#241a4d" flood-opacity=".4"/>
    </filter>
    <filter id="shadowCapsule" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#241a4d" flood-opacity=".28"/>
    </filter>
    <radialGradient id="glowB" cx=".2" cy=".15" r=".6">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".24"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bgB)"/>
  <rect width="512" height="512" rx="116" fill="url(#glowB)"/>

  <!-- 从胶囊里展开的角色卡 -->
  <g transform="rotate(-6 278 236)">
    <rect x="180" y="72" width="196" height="268" rx="28" fill="#ffffff" filter="url(#shadowB)"/>
    <rect x="200" y="92" width="156" height="50" rx="16" fill="url(#headB)"/>
    <circle cx="228" cy="117" r="13" fill="#ffffff" fill-opacity=".92"/>
    <rect x="250" y="106" width="66" height="9" rx="4.5" fill="#ffffff" fill-opacity=".88"/>
    <rect x="250" y="122" width="44" height="8" rx="4" fill="#ffffff" fill-opacity=".55"/>
    <!-- 面具 -->
    <path d="M226 196 C 226 180 240 171 257 174 L 274 178 L 291 174 C 308 171 322 180 322 196
             C 322 222 307 248 274 260 C 241 248 226 222 226 196 Z"
          fill="none" stroke="#3b2a86" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="251" cy="206" rx="14" ry="10" fill="#3b2a86" transform="rotate(-8 251 206)"/>
    <ellipse cx="297" cy="206" rx="14" ry="10" fill="#3b2a86" transform="rotate(8 297 206)"/>
    <rect x="204" y="288" width="148" height="10" rx="5" fill="#d9d2f5"/>
    <rect x="204" y="308" width="96" height="10" rx="5" fill="#e9e4fb"/>
  </g>

  <!-- 输入框胶囊：产品的记忆点 -->
  <g filter="url(#shadowCapsule)">
    <rect x="72" y="258" width="368" height="132" rx="66" fill="#ffffff"/>
    <rect x="96" y="282" width="84" height="84" rx="42" fill="#7c5cff"/>
    <!-- 胶囊里的小面具 -->
    <path d="M111 310 C 111 300 120 295 129 297 L 138 299 L 147 297 C 156 295 165 300 165 310
             C 165 325 156 339 138 345 C 120 339 111 325 111 310 Z"
          fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="127" cy="315" rx="6.5" ry="4.5" fill="#ffffff"/>
    <ellipse cx="149" cy="315" rx="6.5" ry="4.5" fill="#ffffff"/>
    <rect x="204" y="296" width="150" height="14" rx="7" fill="#7c5cff" fill-opacity=".22"/>
    <rect x="204" y="324" width="104" height="12" rx="6" fill="#7c5cff" fill-opacity=".12"/>
  </g>

  <!-- 创作火花 -->
  <g transform="translate(400 108)">
    <path d="M0 -30 C 3 -9 9 -3 30 0 C 9 3 3 9 0 30 C -3 9 -9 3 -30 0 C -9 -3 -3 -9 0 -30 Z"
          fill="url(#starB)"/>
    <path d="M0 -30 C 3 -9 9 -3 30 0 C 9 3 3 9 0 30 C -3 9 -9 3 -30 0 C -9 -3 -3 -9 0 -30 Z"
          fill="none" stroke="#ffffff" stroke-opacity=".45" stroke-width="2"/>
  </g>
</svg>
