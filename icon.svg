<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="CC 角色卡工坊">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6b4cff"/>
      <stop offset=".6" stop-color="#8a6bff"/>
      <stop offset="1" stop-color="#b9a6ff"/>
    </linearGradient>
    <linearGradient id="hd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a6bff"/>
      <stop offset="1" stop-color="#6444f0"/>
    </linearGradient>
    <linearGradient id="st" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe0a3"/>
      <stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- 后一张卡 -->
  <rect x="31" y="18" width="22" height="36" rx="5" fill="#ffffff" fill-opacity=".16"
        stroke="#ffffff" stroke-opacity=".32" stroke-width="1" transform="rotate(8 32 32)"/>

  <!-- 角色卡 -->
  <g transform="rotate(-7 32 32)">
    <rect x="16" y="13" width="26" height="38" rx="6" fill="#ffffff"/>
    <rect x="19" y="16" width="20" height="8" rx="3" fill="url(#hd)"/>
    <circle cx="22.5" cy="20" r="2.2" fill="#ffffff" fill-opacity=".92"/>
    <rect x="26" y="18.2" width="10" height="1.6" rx=".8" fill="#ffffff" fill-opacity=".85"/>

    <!-- 面具 -->
    <path d="M22 31 C 22 28.4 23.9 27 26.2 27.4 L 29 28 L 31.8 27.4 C 34.1 27 36 28.4 36 31
             C 36 34.6 33.9 37.8 29 39.4 C 24.1 37.8 22 34.6 22 31 Z"
          fill="none" stroke="#3b2a86" stroke-width="1.9" stroke-linejoin="round"/>
    <ellipse cx="26.1" cy="31.4" rx="1.9" ry="1.3" fill="#3b2a86" transform="rotate(-10 26.1 31.4)"/>
    <ellipse cx="31.9" cy="31.4" rx="1.9" ry="1.3" fill="#3b2a86" transform="rotate(10 31.9 31.4)"/>
    <path d="M27.4 34.6 C 28.1 35.6 28.9 35.6 29.6 34.6" fill="none" stroke="#3b2a86"
          stroke-width="1.6" stroke-linecap="round"/>

    <rect x="19.5" y="43" width="19" height="1.8" rx=".9" fill="#d9d2f5"/>
    <rect x="19.5" y="46" width="12" height="1.8" rx=".9" fill="#e9e4fb"/>
  </g>

  <!-- 创作火花 -->
  <path d="M51 12 C 51.5 15 52.2 15.7 55 16.2 C 52.2 16.7 51.5 17.4 51 20.4
           C 50.5 17.4 49.8 16.7 47 16.2 C 49.8 15.7 50.5 15 51 12 Z" fill="url(#st)"/>
</svg>
