# 发布工作流
#
#   打 v* tag         → 版本守卫（tag 必须等于 package.json 的 version）→ npm test → npm publish --provenance
#                       → 发布成功后自动建 GitHub Release（正文取自 CHANGELOG.md 的该版本小节）
#   手动 Run workflow → 默认只做安全自检（checkout / setup node / 升级 npm / test / pack），**不发布**
#                       要真发布就把 dry_run 取消勾选（补发场景：tag 那次跑挂了、修好后手动补）
#
# 认证走 npm 的 OIDC Trusted Publishing —— 不需要任何密钥（没有 NPM_TOKEN）。
#
# npm 侧登记（npm 要求包已存在才能登记；本包 0.3.2 已在 npm 上，2026-09-16 登记完成）：
#   https://www.npmjs.com/package/@xia-sc/dsh-cc-studio → Settings → Trusted Publishers → Add publisher
#     Publisher            : GitHub Actions
#     Organization or user : xia-sc
#     Repository           : dsh-cc-studio
#     Workflow filename    : publish.yml   ← 必须与本文件名逐字符一致（只写文件名，不带路径）
#     Environment          : 留空
#     Allow npm publish    : 必须勾选（不勾就只能走 npm stage publish 两段式发布）
#
# 三个硬要求，缺一个就是 ENEEDAUTH / 401：
#   1. publish job 必须有 `permissions: id-token: write`
#   2. 运行器上的 npm 必须 >= 11.5.1（Node 22 自带 npm 10.x，所以有下面的升级步骤）
#   3. npm 侧登记的 仓库 / workflow 文件名 / 环境 必须与这里逐字符一致
#
# ⚠️ 没有任何手动跑法能提前验证 OIDC：`npm publish --dry-run` 的版本查重与 `npm pack` 都不做认证
#    （实测：把 token 换成假值，dry-run 报的错一字不差）。真正的第一次验证就是下一个真版本打 tag；
#    若那时报 ENEEDAUTH/401，按上面 1/2/3 逐条核对，基本都是文件名或环境名对不上。
#
# 本仓库零依赖（lib 与 tests 只 import node:* 内置模块）且没有 package-lock.json，
# 所以刻意不跑 `npm ci`：干净 checkout 直接 `npm test` 即可。

name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只做安全自检（npm pack，不发布）'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # environment: npm-publish     # ← 仅在 npm 侧也登记了同名 Environment 时才需要
    permissions:
      contents: read
      id-token: write               # OIDC：npm 用这个短期令牌认证，取代长期 NPM_TOKEN
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          # 刻意不写 registry-url：setup-node 会据此生成
          #   //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
          # 而 OIDC 模式下没有这个变量。

      - name: Upgrade npm (trusted publishing needs >= 11.5.1)
        run: |
          npm install -g npm@latest
          npm --version

      - name: Version guard (tag 必须等于 package.json 的 version)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          pkg="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          echo "package.json=$pkg  tag=$tag"
          if [ "$pkg" != "$tag" ]; then
            echo "::error::tag v$tag 与 package.json 的 $pkg 不一致；先把版本同步（package.json / README / README_EN / CHANGELOG）再打 tag"
            exit 1
          fi

      - name: Test
        run: npm test

      - name: Pack (手动自检路径；不发布)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: |
          npm pack
          tar -tzf ./*.tgz

      - name: Publish (OIDC + provenance)
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        run: npm publish --provenance

  # 发布成功后再建 Release，所以这里才需要 contents: write；
  # publish job 自己保持 contents: read + id-token: write 的最小权限。
  release:
    needs: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 运行器自带 node，脚本只用 node:fs，不需要 setup-node
      - name: Extract release notes from CHANGELOG.md
        run: node .github/scripts/release-notes.mjs "$GITHUB_REF_NAME"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME — $(cat release-title.txt)" \
            --notes-file release-notes.md \
            --verify-tag
